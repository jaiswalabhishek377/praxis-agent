<!DOCTYPE html>
<html>
<head>
  <title>Apex Healthcare Payer Portal</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #e0f7fa; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px;}
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #00796b; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .error { color: #d32f2f; font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Apex Healthcare Payer Portal</h2>
    <div id="error-msg" class="error"></div>
    <form action="/login" method="POST">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Secure Login</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has("error")) {
      document.getElementById("error-msg").innerText = "Error: " + params.get("error");
    }
  </script>
</body>
</html>
